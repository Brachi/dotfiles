# Single source of truth for packages, tagged by purpose. Replaces the old
# packages.txt + user_configuration.json's hardcoded "packages" array, which
# were two separate, drifting lists.
#
# resolve_packages.py turns a --profile (or explicit --tags) into the flat,
# deduplicated list archinstall's JSON config needs. Add a package once,
# under whichever tag(s) it belongs to; profiles below just name which tags
# to combine.

[tags.base]
# CLI essentials wanted on every machine, GUI or not.
packages = [
    "arch-audit", "base", "base-devel", "efibootmgr", "git", "intel-ucode",
    "linux", "linux-firmware", "man-db", "networkmanager", "openssh",
    "pacman-contrib", "ranger", "ripgrep", "rsync", "sof-firmware", "tmux",
    "tree-sitter-cli", "unzip", "zip", "zram-generator",
]

[tags.security]
# Hardware security keys (FIDO2 SSH keys; ykman's OTP/PIV go through pcscd,
# which install.py enables for this tag) and the GPG-backed password store.
packages = [
    "ccid", "gnupg", "libfido2", "pass", "pcsclite", "yubikey-manager",
]

[tags.dev]
# Matches this laptop's CLI dev stack.
packages = [
    "docker", "github-cli", "lua-language-server", "neovim", "nodejs", "npm",
    "python",
    # Neovim's language servers; ruff lints Python, pylsp handles the rest.
    "python-lsp-server", "ruff", "typescript-language-server",
    "uv",
]

[tags.desktop]
# KDE Plasma + the GUI-only bits that go with it.
packages = [
    "alacritty", "arch-audit-gtk", "firefox", "noto-fonts-cjk", "pipewire",
    "pipewire-alsa", "pipewire-pulse", "plasma-meta", "sddm",
    "ttf-hack", "vulkan-intel", "wireplumber", "wl-clipboard",
    # Nerd Font icons for every terminal and font, via a fontconfig fallback.
    "ttf-nerd-fonts-symbols",
]

[tags.printing]
# CUPS (install.py enables cups.socket for this tag) plus driverless scanning.
# Printer-specific setup lives in setup-printer.sh.
packages = ["cups", "cups-pdf", "sane-airscan", "skanpage"]

[tags.media]
packages = [
    "blender", "kew", "koko", "krita", "mpv", "steam",
]

[tags.extra]
# Everything else from the old lists that doesn't fit a clean category yet -
# fine to re-tag more precisely later.
packages = ["gnucash", "libreoffice-fresh"]

[profiles]
workstation = ["base", "dev", "desktop", "security", "printing", "media", "extra"]
homelab-server = ["base", "dev"]
