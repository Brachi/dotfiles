# Single source of truth for packages, tagged by purpose. Replaces the old
# packages.txt + user_configuration.json's hardcoded "packages" array, which
# were two separate, drifting lists.
#
# resolve_packages.py turns a --profile (or explicit --tags) into the flat,
# deduplicated list archinstall's JSON config needs. Add a package once,
# under whichever tag(s) it belongs to; profiles below just name which tags
# to combine.

[tags.base]
# CLI essentials wanted on every machine, GUI or not.
packages = [
    "arch-audit", "base-devel", "ccid", "chafa", "direnv", "efibootmgr",
    "exfat-utils", "firejail", "git", "git-lfs", "gnupg", "htop",
    "intel-ucode", "libfido2", "linux", "linux-firmware", "man-db",
    "networkmanager", "nmap", "openssh", "7zip", "pacman-contrib",
    "pass", "pcsclite", "ranger", "ripgrep", "rsync", "sof-firmware",
    "tmux", "tree-sitter-cli", "unrar", "unzip", "watchexec", "yazi",
    "yubikey-manager", "zip", "zram-generator",
]

[tags.dev]
# Matches this laptop's CLI dev stack.
packages = [
    "cloc", "cmake", "docker", "emscripten", "github-cli", "jdk-openjdk",
    "neovim", "nodejs", "npm", "python", "uv",
]

[tags.desktop]
# KDE Plasma + the GUI-only bits that go with it.
packages = [
    "alacritty", "arch-audit-gtk", "chromium", "firefox", "libinput-tools",
    "libpulse", "noto-fonts-cjk", "pipewire", "pipewire-alsa",
    "pipewire-pulse", "plasma-meta", "sddm", "spectacle", "ttf-hack-nerd",
    "vulkan-intel", "wireplumber", "wl-clipboard",
]

[tags.printing]
# CUPS (install.py enables cups.socket for this tag) plus driverless scanning.
# Printer-specific setup lives in setup-printer.sh.
packages = [
    "cups", "cups-pdf", "sane-airscan", "skanpage", "system-config-printer",
]

[tags.media]
packages = [
    "audacity", "blender", "gimp", "kew", "koko", "krita", "mpv",
]

[tags.extra]
# Everything else from the old lists that doesn't fit a clean category yet -
# fine to re-tag more precisely later.
packages = [
    "gnucash", "libreoffice-fresh", "steam",
]

[profiles]
workstation = ["base", "dev", "desktop", "printing", "media", "extra"]
homelab-server = ["base", "dev"]
